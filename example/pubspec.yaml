name: scandit_flutter_datacapture_id_voided_detection_example
description: ScanditIdVoidedDetection is a library that enables Voided ID Detection capabilities.

publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: '>=1.0.0 <1.4.0'
  scandit_flutter_datacapture_id_voided_detection:
    path: ../
  scandit_flutter_datacapture_id:
    path: ../../scandit-flutter-datacapture-id
  scandit_flutter_datacapture_core:
    path: ../../scandit-flutter-datacapture-core

dev_dependencies:
  flutter_lints: ^6.0.0
  linter: ^1.30.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  config:
    enable-swift-package-manager: true
